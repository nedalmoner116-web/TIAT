<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIAT - Official Store</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        header { text-align: center; padding: 60px 20px; border-bottom: 1px solid #111; }
        header h1 { font-size: 3.5rem; letter-spacing: 10px; margin: 0; text-transform: uppercase; }
        
        /* شبكة المنتجات (المربعات الطولية اللي بتدور عليها) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            border: 1px solid #1a1a1a;
            padding-bottom: 20px;
            background-color: #050505;
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .product-card:hover { border-color: #444; }

        .product-image {
            width: 100%;
            height: 420px;
            background-color: #111;
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .product-title { font-size: 1.2rem; margin: 15px 0 5px 0; letter-spacing: 1px; }
        .product-price { color: #666; font-size: 1rem; margin-bottom: 15px; }

        .buy-btn {
            background: #fff; color: #000; border: none; padding: 12px 25px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; width: 80%;
        }

        /* لوحة التحكم خليتها تحت خالص عشان متبوظش شكل الموقع */
        .admin-panel {
            background: #0a0a0a; border-top: 2px solid #111; padding: 40px 20px; margin-top: 100px;
        }
        .admin-panel input { width: 80%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>TIAT</h1>
    </header>

    <main class="products-grid">
        
        <div class="product-card">
            <div class="product-image" style="background-image: url('https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=600');"></div>
            <h2 class="product-title">TIAT BLACK HOODIE</h2>
            <p class="product-price">1,200 EGP</p>
            <button class="buy-btn">شراء الآن</button>
        </div>

        <div class="product-card">
            <div class="product-image" style="background-image: url('https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=600');"></div>
            <h2 class="product-title">TIAT OVERSIZED TEE</h2>
            <p class="product-price">750 EGP</p>
            <button class="buy-btn">شراء الآن</button>
        </div>

    </main>

    <div class="admin-panel">
        <h3>لوحة إدارة TIAT (إضافة قطع جديدة)</h3>
        <p style="color: #444;">القطع اللي بتضيفها هنا بتتحفظ عندك في المتصفح</p>
        <input type="text" placeholder="اسم القطعة الجديدة">
        <input type="text" placeholder="السعر">
        <input type="text" placeholder="رابط صورة القطعة">
        <button class="buy-btn" style="background: #222; color: #fff;">إضافة للموقع</button>
    </div>

</body>
</html>
