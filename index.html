<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIAT - Official Store</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid #111;
        }

        header h1 {
            font-size: 3.5rem;
            letter-spacing: 8px;
            margin: 0;
            text-transform: uppercase;
        }

        /* لوحة تحكم المالك */
        .admin-panel {
            background-color: #0a0a0a;
            border: 1px dashed #333;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 4px;
        }

        .admin-panel h3 {
            margin-top: 0;
            color: #fff;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .admin-form input, .admin-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background-color: #000;
            border: 1px solid #333;
            color: #fff;
            box-sizing: border-box;
        }

        /* تصميم المربعات الطولية */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image-container {
            width: 100%;
            height: 420px; /* مربع طولي مخصص للهدوم */
            background-color: #111;
            border: 1px solid #222;
            margin-bottom: 15px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
        }

        .product-title {
            font-size: 1.2rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-short-desc {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }

        /* النوافذ المنبثقة */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #050505;
            padding: 40px;
            border: 1px solid #222;
            max-width: 450px;
            width: 90%;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .buy-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

.order-form input, .order-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #000;
            border: 1px solid #333;
            color: #fff;
            box-sizing: border-box;
            text-align: right;
        }

        .order-form input:focus, .order-form textarea:focus {
            outline: none;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>TIAT</h1>
    </header>

    <!-- لوحة التحكم للمالك -->
    <div class="admin-panel">
        <h3>لوحة إدارة المنتجات (خاصة بك)</h3>
        <div class="admin-form">
            <input type="text" id="newTitle" placeholder="اسم المنتج (مثال: Oversized Hoodie)">
            <textarea id="newDesc" rows="2" placeholder="وصف المنتج وتفاصيل الخامات والمقاسات"></textarea>
            <input type="text" id="newPrice" placeholder="السعر (مثال: 850 EGP)">
            <input type="text" id="newImg" placeholder="رابط الصورة المباشر (Direct Link)">
            <button class="buy-btn" onclick="addNewProduct()" style="margin-top:0;">إضافة المنتج للموقع</button>
        </div>
    </div>

    <!-- شبكة عرض المنتجات -->
    <main class="products-grid" id="productsGrid">
        <!-- المنتجات المضافة هتظهر هنا تلقائياً -->
    </main>

    <!-- شاشة التفاصيل -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('detailsModal')">&times;</button>
            <h2 id="modalTitle" style="letter-spacing: 1px;"></h2>
            <p id="modalDesc" style="color: #aaa; line-height: 1.6;"></p>
            <button class="buy-btn" id="modalPriceBtn" onclick="openOrderForm()">شراء</button>
        </div>
    </div>

    <!-- شاشة نموذج الطلب وربطها بحسابك في Formspree -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('orderModal')">&times;</button>
            <h3>تأكيد طلب الشراء</h3>
            <p style="color:#666;">ادخل بياناتك لشحن المنتج</p>
            
            <form class="order-form" action="https://formspree.io/f/mjglnkkz" method="POST">
                <!-- خانة مخفية بداخلها اسم المنتج عشان يجيلك في الميل العميل طالب إيه بالظبط -->
                <input type="hidden" name="المنتج المطلوب" id="formProduct">
                
                <input type="text" name="اسم العميل" placeholder="الاسم بالكامل" required>
                <input type="tel" name="رقم التواصل" placeholder="رقم الموبايل" required>
                <textarea name="عنوان الشحن" rows="3" placeholder="العنوان بالتفصيل المحافظة/المدينة/الشارع" required></textarea>
                
                <button type="submit" class="buy-btn">تأكيد وإرسال الطلب</button>
            </form>
        </div>
    </div>

    <script>
        // تحميل المنتجات المحفوظة أول ما الصفحة تفتح
        window.onload = function() {
            displaySavedProducts();
        };

        function addNewProduct() {
            let title = document.getElementById('newTitle').value;
            let desc = document.getElementById('newDesc').value;
            let price = document.getElementById('newPrice').value;
            let img = document.getElementById('newImg').value;

            if(!title || !price) {
                alert('برجاء كتابة اسم المنتج والسعر على الأقل!');
                return;
            }

            let product = { title, desc, price, img };

            // جلب المنتجات القديمة وحفظ الجديدة عليها
            let products = localStorage.getItem('tiat_products') ? JSON.parse(localStorage.getItem('tiat_products')) : [];
            products.push(product);
            localStorage.setItem('tiat_products', JSON.stringify(products));

// إعادة عرض المنتجات وتفريغ الخانات
            displaySavedProducts();
            document.getElementById('newTitle').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newImg').value = '';
        }

        function displaySavedProducts() {
            let grid = document.getElementById('productsGrid');
            grid.innerHTML = ''; // تنظيف الشبكة
            
            let products = localStorage.getItem('tiat_products') ? JSON.parse(localStorage.getItem('tiat_products')) : [];

            products.forEach(function(product) {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = function() { openDetailsModal(product.title, product.desc, product.price); };

                let bgStyle = product.img ? style="background-image: url('${product.img}');" : '';
                let placeholderText = product.img ? '' : 'صورة المنتج طولي';

                card.innerHTML = 
                    <div class="product-image-container" ${bgStyle}>${placeholderText}</div>
                    <h2 class="product-title">${product.title}</h2>
                    <p class="product-short-desc">${product.price}</p>
                ;
                grid.appendChild(card);
            });
        }

        function openDetailsModal(title, desc, price) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc || 'لا يوجد وصف إضافي لهذه القطعة حالياً.';
            document.getElementById('modalPriceBtn').innerText = 'طلب شراء - ' + price;
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function openOrderForm() {
            let currentProduct = document.getElementById('modalTitle').innerText;
            document.getElementById('formProduct').value = currentProduct; // وضع اسم المنتج في الخانة المخفية لـ Formspree
            document.getElementById('detailsModal').style.display = 'none';
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>

</body>
</html>
